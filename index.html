<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>camera_code</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.5px;
    margin: 0 0 16px;
    color: #f5f5f5;
  }
  #stage {
    position: relative;
    background: #000;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    overflow: hidden;
    width: min(96vw, 1400px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage.empty { min-height: min(60vh, 700px); }
  video { display: none; }
  #ascii {
    display: block;
    white-space: pre;
    font-family: "Courier New", monospace;
    line-height: 1;
    color: #d8d8d8;
    background: #000;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    font-size: 14px;
    padding: 20px;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button, select {
    background: transparent;
    border: 1px solid #3a3a3a;
    color: #e8e8e8;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #666; }
  button:active { transform: scale(0.97); }
  label { font-size: 12px; color: #888; align-self: center; }
  .row { display: flex; align-items: center; gap: 6px; }
  body.kiosk .controls { opacity: 0; pointer-events: none; }
  body.kiosk h1 { opacity: 0.15; }
  body.kiosk #stage { border: none; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  body.kiosk { padding: 0; }
  body.kiosk #ascii { max-width: 100vw; max-height: 100vh; }
  #hint {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    text-align: center;
    color: #666;
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
  }
  #exitBtn {
    position: absolute;
    top: 16px;
    right: 16px;
    display: none;
    background: rgba(0,0,0,0.4);
    border: 1px solid #444;
    color: #ccc;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  #exitBtn:hover { border-color: #888; color: #fff; }
  body.kiosk #exitBtn { display: block; }
</style>
</head>
<body>

<div id="stage" class="empty">
  <video id="video" autoplay playsinline muted></video>
  <pre id="ascii"></pre>
  <div id="overlay">Pulsa «Activar cámara» para empezar</div>
  <div id="hint" style="display:none">ponte delante de la cámara</div>
  <button id="exitBtn">Salir del modo exposición</button>
</div>

<div class="controls">
  <button id="startBtn">Activar cámara</button>
  <div class="row">
    <label>Resolución</label>
    <select id="resSel">
      <option value="70">Baja</option>
      <option value="100" selected>Media</option>
      <option value="140">Alta</option>
    </select>
  </div>
  <div class="row">
    <label>Invertir</label>
    <input type="checkbox" id="invert">
  </div>
  <div class="row">
    <label>Contraste</label>
    <input type="range" id="contrastSlider" min="1" max="3" step="0.1" value="1.8" style="width:90px">
  </div>
  <button id="snapBtn" disabled>Guardar fotograma</button>
  <button id="kioskBtn" disabled>Modo exposición (F)</button>
</div>

<script>
const video = document.getElementById('video');
const ascii = document.getElementById('ascii');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const kioskBtn = document.getElementById('kioskBtn');
const resSel = document.getElementById('resSel');
const invert = document.getElementById('invert');
const contrastSlider = document.getElementById('contrastSlider');
const hint = document.getElementById('hint');
const exitBtn = document.getElementById('exitBtn');

// смешанный набор: цифры, буквы, спецсимволы клавиатуры,
// отсортированные по визуальной "плотности" от тёмного к светлому
const RAMP = "@#%&8W$B96MHENAKXQZ0OU4D2G5R83SC?F1TJ7YIL*x+~<>i!lc;:,^\"'`.   ";

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let running = false;
let cols = 100;

function fit() {
  cols = parseInt(resSel.value, 10);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
    overlay.style.display = 'none';
    document.getElementById('stage').classList.remove('empty');
    running = true;
    snapBtn.disabled = false;
    kioskBtn.disabled = false;
    startBtn.textContent = 'Cámara activada';
    startBtn.disabled = true;

    // reconexión automática si la cámara se desconecta (útil para uso prolongado en una exposición)
    stream.getVideoTracks()[0].addEventListener('ended', () => {
      running = false;
      overlay.textContent = 'Cámara desconectada, reconectando...';
      overlay.style.display = 'flex';
      setTimeout(startCamera, 1500);
    });

    requestAnimationFrame(render);
  } catch (err) {
    overlay.textContent = 'No se pudo acceder a la cámara: ' + err.message;
    setTimeout(startCamera, 3000);
  }
}

function toggleKiosk() {
  document.body.classList.toggle('kiosk');
  hint.style.display = document.body.classList.contains('kiosk') ? 'block' : 'none';
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

kioskBtn.addEventListener('click', toggleKiosk);
exitBtn.addEventListener('click', toggleKiosk);
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'f' && !kioskBtn.disabled) toggleKiosk();
  if (e.key === 'Escape' && document.body.classList.contains('kiosk')) toggleKiosk();
});
// si el usuario sale de pantalla completa con el gesto propio del navegador, sincroniza el modo
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('kiosk')) {
    document.body.classList.remove('kiosk');
    hint.style.display = 'none';
  }
});

function render() {
  if (!running) return;
  fit();

  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  if (!vw || !vh) { requestAnimationFrame(render); return; }

  const charAspect = 0.55; // символы выше, чем широкие
  const rows = Math.round((cols * (vh / vw)) * charAspect);

  canvas.width = cols;
  canvas.height = rows;
  ctx.save();
  ctx.translate(cols, 0);
  ctx.scale(-1, 1); // зеркалим, как обычная веб-камера
  ctx.drawImage(video, 0, 0, cols, rows);
  ctx.restore();

  const frame = ctx.getImageData(0, 0, cols, rows).data;
  let out = '';
  const doInvert = invert.checked;
  const contrast = parseFloat(contrastSlider.value);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      let bright = (frame[i] * 0.299 + frame[i + 1] * 0.587 + frame[i + 2] * 0.114) / 255;
      // aumenta el contraste alrededor del punto medio: separa la silueta del fondo
      bright = (bright - 0.5) * contrast + 0.5;
      bright = Math.max(0, Math.min(1, bright));
      if (doInvert) bright = 1 - bright;
      const idx = Math.min(RAMP.length - 1, Math.floor(bright * RAMP.length));
      out += RAMP[idx];
    }
    out += '\n';
  }
  ascii.textContent = out;

  const stage = document.getElementById('stage');
  const availableWidth = stage.clientWidth || 900;
  const fontSize = Math.max(3, Math.min(14, availableWidth / cols));
  ascii.style.fontSize = fontSize + 'px';

  requestAnimationFrame(render);
}

startBtn.addEventListener('click', startCamera);

snapBtn.addEventListener('click', () => {
  const blob = new Blob([ascii.textContent], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fotograma-ascii.txt';
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
